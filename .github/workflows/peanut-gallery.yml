name: Peanut Gallery Review

# Run the persona-driven reviewer (charles8051/peanut-gallery) on this repo's PRs.
# Runs on push to a PR AND on new PR comments, so reviewers can respond to the author
# (e.g. withdraw a finding called out as intentional). Stateful; the guards below keep
# a comment reply from spawning another review.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # 'created' only. An EDIT to an existing comment buys a whole extra panel turn: a new
  # comment defeats the unchanged-skip, so every persona re-runs (and re-verifies) against
  # a diff that did not move. Fixing a typo in a review reply is not worth a full panel.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

# cancel-in-progress: false, unlike ci.yml, which cancels. A kill here recorded a
# CANCELLED conclusion that turned the PR check rollup UNSTABLE even though the review
# posted fine. With false, a push-vs-comment collision queues (A completes, then B runs)
# — both green; serialization keeps the persona-comment writes single-writer, so B
# updates A's comment in place (CommentSync marker upsert), never a duplicate. A
# genuinely stale run (head moved on) clean-exits inside the action (Supersession),
# which a workflow-level head-SHA `if:` could not do correctly — an issue_comment run
# has github.sha=main and carries no head SHA.
concurrency:
  group: peanut-gallery-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    # Three separate gates.
    #
    # Fork gate (pull_request only). A pull_request event runs this workflow from the
    # PR's merge ref and checks the fork's tree out onto the self-hosted runner. The
    # action itself comes from charles8051/peanut-gallery rather than the checkout, so
    # no fork-authored action code runs — but the fork's files land on the runner, and
    # the fork's copy of THIS FILE is what executes, so an edited job here runs whatever
    # it likes. Keep fork PRs off the self-hosted runner.
    #
    # No hosted twin, unlike ci.yml's build-fork job: a fork pull_request receives no
    # secrets, so OPENROUTER_API_KEY is empty and there is no review to run. A skipped
    # job reports neutral, so nothing hangs waiting on it.
    #
    # That clause is availability and hygiene, not a security boundary, for the reason
    # above: the fork controls this condition. The boundary is "Require approval for all
    # outside collaborators" under Settings -> Actions. This repo is public, so that
    # setting is available and is the thing actually holding the line.
    #
    # Bot guard: skip our own review comments so they don't spawn no-op jobs.
    #
    # Author gate (issue_comment only). An issue_comment runs the BASE repo's copy of
    # this file, on the base repo's token — so a condition here is one an outsider
    # cannot edit, and is a real boundary rather than hygiene. Without it, any GitHub
    # account commenting on a PR of this public repo starts a job on the maintainer's
    # own hardware, holding OPENROUTER_API_KEY and pull-requests: write. The action
    # refuses untrusted callers internally, but the job has already been scheduled,
    # checked out, and handed the secrets by then.
    #
    # OWNER / MEMBER / COLLABORATOR only. CONTRIBUTOR is deliberately excluded: it means
    # "has had a PR merged here at some point", which is exactly the graduation rule that
    # makes the default fork-approval policy too weak.
    #
    # "Require approval for all outside collaborators" does not cover this. That setting
    # gates fork pull requests; issue_comment is not one.
    #
    # github.event.issue.pull_request is populated ONLY for PR comments. Gate on it: the
    # action resolves the PR by github.event.issue.number, and GET /pulls/<n> 404s when
    # <n> is a plain issue.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.type != 'Bot' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                 github.event.comment.author_association)))
    runs-on: [self-hosted, linux, x64, docker]
    timeout-minutes: 15   # backstop: kill a wedged review instead of holding the runner for hours
    steps:
      # Pinned for the same reason the action below is, and it matters more here than the
      # ordering suggests: checkout runs FIRST, so a compromised or retagged release
      # executes on this runner before anything else, with the job's token and write
      # access to the workspace. ci.yml can float to @v6 — this job is the
      # fork-reachable one.
      #
      # d23441a is the commit v6 and v6.1.0 both point at today.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Without this, checkout leaves the job's token in .git/config inside the
          # workspace. The action needs no git credential of its own.
          persist-credentials: false
          # No fetch-depth: 0 here, unlike ci.yml. Nothing in this job runs MinVer; the
          # reviewer reads the PR diff from the API, not from local history.

      # Pinned to a commit, not a branch. This is the one step that runs third-party code
      # on a self-hosted runner while holding a provider API key and pull-requests: write,
      # so a mutable ref means whoever can push to that repository's main executes here on
      # the next PR event, across every open PR, with no diff in this repo to review.
      #
      # To move it: pick a tag, resolve it with
      # `gh api repos/charles8051/peanut-gallery/tags`, and paste both here.
      - uses: charles8051/peanut-gallery@aa1f3845086e0400b5d64070b876a45444207bad # v0.1.1
        with:
          config: .github/peanut-gallery.json   # single general reviewer; orchestrator adds diff-specific reviewers
          pr-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
