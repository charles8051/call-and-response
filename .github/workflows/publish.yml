name: Publish

# Publishes the four packable projects to nuget.org on a v* tag.
#
# Authentication is nuget.org Trusted Publishing: the job requests a short-lived
# OIDC token from GitHub, nuget.org validates it against a policy registered for
# this repository and this workflow file, and returns a temporary API key good
# for one hour. No long-lived key is stored anywhere.
#
# The policy on nuget.org must name:
#   Repository Owner  charles8051
#   Repository        call-and-response
#   Workflow File     publish.yml          <- filename only, no path
#   Environment       nuget.org
#
# Renaming this file breaks publishing until the policy is updated to match.
#
# Runs on a GitHub-hosted runner rather than ci-build-01. This job handles a
# credential and runs a few times a year; a clean throwaway VM is the right
# place for that, and it keeps releases independent of runner availability.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The check that the repository describes the release being tagged. It runs before
  # anything is built, so a forgotten doc costs a re-tag and nothing else -- once
  # nuget.org has a version, what shipped with it cannot be replaced.
  #
  # docs/BREAKING-CHANGES.md groups entries by the release they ship in. An
  # "## Unreleased" heading at tag time means the section this tag ships was never
  # retitled, so the doc tells a reader that changes they just received are still
  # pending. Fix it, delete the tag, and tag again:
  #
  #   git tag -d vX.Y.Z && git push origin :refs/tags/vX.Y.Z
  #
  # The job also requires the tag to be annotated with a non-empty message. That
  # message IS the release notes: this workflow creates no GitHub Release, and the repo
  # keeps no CHANGELOG, so a lightweight or empty tag publishes packages whose reason
  # for existing is recorded nowhere. A warning would not have stopped that, so it
  # fails. The message is echoed into the run summary, which is where the notes are
  # readable today.
  #
  # NOT enforced: that the newest heading in the doc names this tag. The doc's contract
  # is "each release that changes what a caller sees gets a section", so a release with
  # no caller-visible change correctly has none, and a hard check would force an empty
  # section onto every patch. The mismatch is surfaced as a notice instead.
  #
  # On workflow_dispatch the steps are skipped and the job still succeeds. A skipped
  # job would skip the publish job that needs it, which would retire the dry run.
  release-notes:
    name: Check the release describes itself
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Assert BREAKING-CHANGES.md names this release
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/BREAKING-CHANGES.md
          [ -f "$doc" ] || { echo "::error::$doc is missing."; exit 1; }
          if grep -qiE '^##[[:space:]]+\[?Unreleased\]?[[:space:]]*$' "$doc"; then
            echo "::error file=$doc::Still has an '## Unreleased' heading at ${GITHUB_REF_NAME}."
            echo "Retitle that section to ${GITHUB_REF_NAME}, commit, and move the tag."
            grep -niE '^##[[:space:]]+\[?Unreleased\]?[[:space:]]*$' "$doc"
            exit 1
          fi
          echo "No unreleased section. ${GITHUB_REF_NAME} is described."
          # The newest heading naming an older release is legitimate -- it means nothing
          # a caller can see changed -- so this is a notice, not a failure. It exists so
          # that "nothing broke" is a decision someone reads rather than an omission.
          version="${GITHUB_REF_NAME#v}"
          newest="$(grep -m1 -E '^##[[:space:]]' "$doc" || true)"
          named="$(printf '%s\n' "$newest" | sed -E 's/^##[[:space:]]+//; s/^[[`]//; s/^v//; s/[]`[:space:]].*$//')"
          if [ "$named" != "$version" ]; then
            echo "::notice file=$doc::Newest section is '${named:-none}', not ${version}."
            echo "::notice file=$doc::Publishing ${GITHUB_REF_NAME} as a release with no caller-visible change. If that is wrong, add its section and move the tag."
          fi

      - name: Assert the tag carries release notes
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          # checkout replaces annotated tags with lightweight ones, which have no
          # message. Re-fetch the tag objects before reading their contents.
          git fetch --force --tags --quiet
          tag="${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$tag" 2>/dev/null || true)" != "tag" ]; then
            echo "::error::${tag} is a lightweight tag, so it carries no release notes."
            echo "Nothing else in this repository records what a release was for."
            echo "Delete the tag, recreate it annotated with the notes as its message, and push it."
            exit 1
          fi
          # A subject that is only the tag name repeats the version, so it is dropped.
          # Any other subject is part of the notes. Drop a PGP trailer if signed.
          subject="$(git tag -l --format='%(contents:subject)' "$tag")"
          if [ "$subject" = "$tag" ]; then part='contents:body'; else part='contents'; fi
          body="$(git tag -l --format="%(${part})" "$tag" | sed '/-----BEGIN PGP SIGNATURE-----/,$d')"
          if [ -z "${body//[$' \t\n']/}" ]; then
            echo "::error::${tag} is annotated but its message is empty, so it carries no release notes."
            echo "Write them into the tag message and move the tag."
            exit 1
          fi
          {
            echo "## Release notes on \`${tag}\`"
            echo
            echo "$body"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Release notes, ${#body} chars:"
          echo "$body"

  publish:
    name: Pack and publish
    needs: [release-notes]
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      contents: read
      id-token: write   # required for nuget.org to issue the short-lived key
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # MinVer derives the version from the tag being built; a shallow
          # checkout fetches none and would publish 0.0.0-alpha.0.
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          # 10.0 because .slnx needs SDK 9.0.200+ to parse; 8.0 because that is
          # what everything targets and what the test host must run on.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build CallAndResponse.slnx --configuration Release

      # Never publish a tag that does not pass its own tests.
      - name: Test
        run: dotnet test CallAndResponse.slnx --configuration Release --no-build

      # Examples set IsPackable=false, so this emits exactly the four library
      # packages. MinVer sets the version from the tag -- do not pass
      # -p:PackageVersion, which MinVer overrides anyway.
      - name: Pack
        run: dotnet pack CallAndResponse.slnx --configuration Release --no-build --output artifacts

      - name: List packages
        run: ls -l artifacts

      # Requested immediately before the push: the key expires after one hour.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Gated on the EVENT, not on an input. The only push trigger is a v* tag, so
      # this runs for a release tag and nothing else - a dispatch cannot reach it
      # whatever ref the UI had selected. There is deliberately no `dry_run: false`
      # escape hatch: it would publish a branch's code under whatever version the
      # version scheme derived, permanently. One release mechanism, and it is the tag.
      - name: Push to nuget.org
        if: ${{ github.event_name == 'push' }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Dry run complete
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Dry run: the OIDC exchange with nuget.org succeeded and the"
          echo "packages below were built. Nothing was pushed."
          ls -1 artifacts

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: warn
